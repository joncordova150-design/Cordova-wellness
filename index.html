<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Cordova Wellness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --text:#e9e9ef;
      --muted:#a9a9b6;
      --red:#ff2a2a;
      --stroke:rgba(255,255,255,.06);
      --shadow: 0 10px 35px rgba(0,0,0,.55);
      --glow: 0 0 18px rgba(255,42,42,.35), 0 0 40px rgba(255,42,42,.18);
      --radius:22px;
      --radius2:18px;
      --btnH:56px;
      --safeB: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Source Sans 3", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.55;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.06) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 25%, rgba(255,255,255,.05) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 70%, rgba(255,255,255,.06) 0 1px, transparent 2px),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,.05) 0 1px, transparent 2px),
        radial-gradient(circle at 45% 35%, rgba(255,42,42,.10) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 55%, rgba(255,42,42,.08) 0 1px, transparent 2px);
      mix-blend-mode: screen;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.55));
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .topbarInner{
      max-width:520px;
      margin: 0 auto;
      padding: 14px 14px 12px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    .brand{display:flex;flex-direction:column;gap:6px;min-width:0}
    .brand h1{
      margin:0;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 800;
      color: var(--red);
      text-shadow: var(--glow);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand p{
      margin:0;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.25;
    }
    .pillRow{display:flex;gap:10px;align-items:center;flex-shrink:0}
    .pill{
      border:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      display:flex;
      gap:8px;
      align-items:center;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .pill .dot{width:8px;height:8px;border-radius:50%;background: var(--red);box-shadow: var(--glow)}
    .pillBtn{cursor:pointer}

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 14px calc(110px + var(--safeB));
    }
    .notice{
      margin: 14px 0 8px;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,42,42,.16), rgba(255,42,42,.06));
      border: 1px solid rgba(255,42,42,.22);
      box-shadow: var(--shadow);
      color: rgba(255,255,255,.92);
      font-size: 13.5px;
      line-height: 1.25;
    }
    .notice strong{color:#fff}

    .grid{display:flex;flex-direction:column;gap:14px;margin-top:12px}
    .card{
      border-radius: var(--radius);
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }
    .imgWrap{position:relative;height:210px;background:#07070a}
    .imgWrap img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.05)}
    .imgFade{
      position:absolute;left:0;right:0;bottom:0;height:74px;
      background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0));
      pointer-events:none;
    }
    .content{
      padding: 12px 12px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
    }
    .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .title{font-size:20px;font-weight:800;margin:0;line-height:1.1}
    .desc{margin:6px 0 0;color:rgba(255,255,255,.78);font-size:14px;line-height:1.25;max-width:360px}
    .priceBadge{
      flex-shrink:0;border-radius:999px;padding:8px 12px;
      border: 1px solid rgba(255,42,42,.35);
      background: radial-gradient(circle at 30% 30%, rgba(255,42,42,.28), rgba(255,42,42,.10));
      box-shadow: var(--glow);
      font-weight: 900;
      min-width: 92px;
      text-align:center;
    }
    .actions{display:flex;gap:12px;margin-top:12px}
    .btn{
      height: var(--btnH);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color: var(--text);
      font-weight: 900;
      font-size: 16px;
      flex: 1;
      box-shadow: 0 14px 30px rgba(0,0,0,.35);
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform: translateY(1px)}
    .btnPrimary{
      border: 1px solid rgba(255,42,42,.35);
      background: radial-gradient(circle at 30% 30%, rgba(255,42,42,.28), rgba(255,42,42,.10));
      box-shadow: var(--glow), 0 14px 30px rgba(0,0,0,.35);
    }
    .btnGhost{color: rgba(255,255,255,.82)}
    .qty{margin-top:10px;display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:13px}

    .bottomBar{
      position: fixed;left:0;right:0;bottom:0;z-index:80;
      padding: 10px 12px calc(10px + var(--safeB));
      background: linear-gradient(to top, rgba(0,0,0,.96), rgba(0,0,0,.55));
      border-top: 1px solid rgba(255,255,255,.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .bottomInner{max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:stretch}
    .totalCard{
      flex:1;border-radius: var(--radius2);
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: var(--shadow);
      padding: 10px 12px;
      display:flex;flex-direction:column;justify-content:center;min-width:0;
    }
    .totalLabel{font-size:13px;color:var(--muted);font-weight:700;margin:0}
    .totalValue{margin:2px 0 0;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .totalItems{margin:0;font-size:13px;color:rgba(255,255,255,.78);font-weight:700}
    .ctaCol{width:180px;display:flex;flex-direction:column;gap:10px}
    .cta{
      height:52px;border-radius:999px;
      border: 1px solid rgba(255,42,42,.35);
      background: radial-gradient(circle at 30% 30%, rgba(255,42,42,.28), rgba(255,42,42,.10));
      box-shadow: var(--glow), 0 14px 30px rgba(0,0,0,.35);
      color: var(--text);
      font-weight: 900;
      font-size: 16px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ctaSecondary{
      height:48px;border-radius:999px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      color: rgba(255,255,255,.90);
      font-weight: 900;
      font-size: 15px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tiny{
      margin: 10px 2px 0;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      line-height: 1.2;
      text-align:center;
    }

    .modalOverlay{
      position: fixed; inset: 0;
      background: rgba(0,0,0,.72);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index: 120;
      padding: 12px 12px calc(12px + var(--safeB));
    }
    .modal{
      width: min(520px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(15,15,22,.96), rgba(0,0,0,.92));
      box-shadow: 0 24px 70px rgba(0,0,0,.65);
      overflow:hidden;
    }
    .modalHead{
      padding: 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .modalTitle{margin:0;font-size:18px;font-weight:900}
    .xBtn{
      width: 40px;height:40px;border-radius:999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .modalBody{padding: 14px;color: rgba(255,255,255,.85);font-size:14px;line-height:1.35}
    .modalBody code{
      background: rgba(255,255,255,.06);
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.08);
    }
    @media (max-width: 430px){
      .ctaCol{width:165px}
      .imgWrap{height:200px}
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbarInner">
      <div class="brand">
        <h1>Cordova Wellness</h1>
        <p id="brandSub">Local delivery of lab-tested, hemp-derived wellness products for adults 21+.</p>
      </div>
      <div class="pillRow">
        <div class="pill"><span class="dot"></span><span id="statusText">Open</span></div>
        <button class="pill pillBtn" id="langBtn">EN / ES</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="notice" id="notice">
      <strong>21+ only.</strong> Hemp-derived products. Age verification required on delivery. No medical claims.
    </div>

    <section class="grid" id="productGrid"></section>

    <p class="tiny" id="footerTiny">
      Questions? Tap <strong>Text order</strong> to send your cart to <strong>973-916-7374</strong>.
    </p>
  </main>

  <footer class="bottomBar">
    <div class="bottomInner">
      <div class="totalCard">
        <p class="totalLabel" id="liveTotalLabel">Live total</p>
        <p class="totalValue" id="totalValue">$0.00</p>
        <p class="totalItems" id="totalItems">0 items</p>
      </div>
      <div class="ctaCol">
        <button class="cta" id="textOrderBtn">Text order</button>
        <button class="ctaSecondary" id="copyBtn">Copy message</button>
      </div>
    </div>
  </footer>

  <div class="modalOverlay" id="modalOverlay" aria-hidden="true">
    <div class="modal">
      <div class="modalHead">
        <h3 class="modalTitle" id="modalTitle">Message copied</h3>
        <button class="xBtn" id="modalClose">×</button>
      </div>
      <div class="modalBody" id="modalBody"></div>
    </div>
  </div>

<script>
(() => {
  const PHONE = "9739167374";

  // ✅ LOCKED IMAGE MAPPING (correct to your screenshots)
  const ITEMS = [
    {
      id: "gummies",
      price: 25,
      img: "IMG_8908.png", // gummies
      en: { name: "CBD Gummies", desc: "Fruit gummies. Multiple strengths available. Lab-tested hemp-derived CBD." },
      es: { name: "Gomitas de CBD", desc: "Gomitas frutales. Varias potencias. CBD de cáñamo probado en laboratorio." }
    },
    {
      id: "vape",
      price: 35,
      img: "IMG_8911.png", // vape
      en: { name: "CBD Vape (Disposable)", desc: "Disposable vape. Flavors vary. Lab-tested hemp-derived cannabinoids." },
      es: { name: "Vape de CBD (Desechable)", desc: "Vape desechable. Sabores varían. Cannabinoides de cáñamo probados en laboratorio." }
    },
    {
      id: "preroll",
      price: 15,
      img: "IMG_8910.png", // pre-roll
      en: { name: "Hemp Pre-Roll", desc: "Hemp-derived pre-roll option. Availability varies. Lab-tested." },
      es: { name: "Pre-roll de Cáñamo", desc: "Opción de pre-roll derivado de cáñamo. Disponibilidad varía. Probado en laboratorio." }
    },
    {
      id: "tincture",
      price: 30,
      img: "IMG_8909.png", // tincture
      en: { name: "CBD Tincture", desc: "Dropper bottle tincture. Strengths vary. Lab-tested hemp-derived CBD." },
      es: { name: "Tintura de CBD", desc: "Tintura en gotero. Potencias varían. CBD de cáñamo probado en laboratorio." }
    }
  ];

  const state = {
    lang: localStorage.getItem("cw_lang") || "en",
    cart: loadCart()
  };

  const grid = document.getElementById("productGrid");
  const totalValueEl = document.getElementById("totalValue");
  const totalItemsEl = document.getElementById("totalItems");
  const textOrderBtn = document.getElementById("textOrderBtn");
  const copyBtn = document.getElementById("copyBtn");
  const langBtn = document.getElementById("langBtn");

  const brandSub = document.getElementById("brandSub");
  const notice = document.getElementById("notice");
  const footerTiny = document.getElementById("footerTiny");
  const liveTotalLabel = document.getElementById("liveTotalLabel");

  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");
  const modalClose = document.getElementById("modalClose");

  function vibe(ms=18){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
  function money(n){ return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n); }

  function loadCart(){
    try{ return JSON.parse(localStorage.getItem("cw_cart") || "{}"); }
    catch(e){ return {}; }
  }
  function saveCart(){ localStorage.setItem("cw_cart", JSON.stringify(state.cart)); }

  function cartQty(id){ return state.cart[id] || 0; }
  function setQty(id, qty){
    if(qty <= 0) delete state.cart[id];
    else state.cart[id] = qty;
    saveCart();
  }

  function total(){
    let t=0, count=0;
    for(const item of ITEMS){
      const q = cartQty(item.id);
      if(q){ t += q * item.price; count += q; }
    }
    return { t, count };
  }

  function t(key){
    const dict = {
      en: {
        sub: "Local delivery of lab-tested, hemp-derived wellness products for adults 21+.",
        notice: "<strong>21+ only.</strong> Hemp-derived products. Age verification required on delivery. No medical claims.",
        liveTotal: "Live total",
        items: (n)=> `${n} item${n===1?"":"s"}`,
        add: "Add",
        remove: "Remove",
        textOrder: "Text order",
        copy: "Copy message",
        copied: "Message copied",
        emptyCart: "Your cart is empty. Add at least one item.",
        copiedHint: "Paste this into a text message to <code>973-916-7374</code>:",
        orderTitle: "Cordova Wellness order",
        ageLine: "I confirm I am 21+.",
        deliveryLine: "Delivery area: Newark/Kearny area (local).",
        footer: "Questions? Tap <strong>Text order</strong> to send your cart to <strong>973-916-7374</strong>."
      },
      es: {
        sub: "Entrega local de productos de bienestar de cáñamo, probados en laboratorio, para adultos 21+.",
        notice: "<strong>Solo 21+.</strong> Productos derivados de cáñamo. Verificación de edad requerida en la entrega. Sin afirmaciones médicas.",
        liveTotal: "Total en vivo",
        items: (n)=> `${n} artículo${n===1?"":"s"}`,
        add: "Agregar",
        remove: "Quitar",
        textOrder: "Enviar por texto",
        copy: "Copiar mensaje",
        copied: "Mensaje copiado",
        emptyCart: "Tu carrito está vacío. Agrega al menos un artículo.",
        copiedHint: "Pega esto en un mensaje de texto a <code>973-916-7374</code>:",
        orderTitle: "Pedido Cordova Wellness",
        ageLine: "Confirmo que tengo 21+.",
        deliveryLine: "Área de entrega: zona Newark/Kearny (local).",
        footer: "¿Preguntas? Toca <strong>Enviar por texto</strong> para mandar tu carrito a <strong>973-916-7374</strong>."
      }
    };
    return dict[state.lang][key];
  }

  function buildMessage(){
    const lines = [];
    lines.push(`✅ ${t("orderTitle")}`);
    lines.push(t("ageLine"));
    lines.push(t("deliveryLine"));
    lines.push("");
    lines.push("Items:");

    let subtotal = 0;
    for(const item of ITEMS){
      const q = cartQty(item.id);
      if(!q) continue;
      const label = state.lang === "en" ? item.en.name : item.es.name;
      lines.push(`- ${label} x${q} (${money(item.price)} each)`);
      subtotal += q * item.price;
    }

    lines.push("");
    lines.push(`Total: ${money(subtotal)}`);
    lines.push("");
    lines.push("Name:");
    lines.push("Address (or meet-up spot):");
    lines.push("Preferred time:");
    return lines.join("\n");
  }

  function openSMS(message){
    const encoded = encodeURIComponent(message);
    const a = document.createElement("a");
    a.href = `sms:${PHONE}&body=${encoded}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => {
      const b = document.createElement("a");
      b.href = `sms:${PHONE}?&body=${encoded}`;
      document.body.appendChild(b);
      b.click();
      b.remove();
    }, 250);
  }

  function showModal(title, bodyHtml){
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalOverlay.style.display = "flex";
    modalOverlay.setAttribute("aria-hidden","false");
  }
  function hideModal(){
    modalOverlay.style.display = "none";
    modalOverlay.setAttribute("aria-hidden","true");
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function render(){
    brandSub.textContent = t("sub");
    notice.innerHTML = t("notice");
    liveTotalLabel.textContent = t("liveTotal");
    textOrderBtn.textContent = t("textOrder");
    copyBtn.textContent = t("copy");
    footerTiny.innerHTML = t("footer");

    grid.innerHTML = "";

    for(const item of ITEMS){
      const qty = cartQty(item.id);
      const langObj = state.lang === "en" ? item.en : item.es;

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div class="imgWrap">
          <img src="${item.img}" alt="${escapeHtml(langObj.name)}" loading="lazy" />
          <div class="imgFade"></div>
        </div>

        <div class="content">
          <div class="row">
            <div>
              <h2 class="title">${escapeHtml(langObj.name)}</h2>
              <p class="desc">${escapeHtml(langObj.desc)}</p>
            </div>
            <div class="priceBadge">${money(item.price)}</div>
          </div>

          <div class="actions">
            <button class="btn btnPrimary" data-action="add" data-id="${item.id}">${t("add")}</button>
            <button class="btn btnGhost" data-action="remove" data-id="${item.id}">${t("remove")}</button>
          </div>

          <div class="qty">
            <span>${state.lang === "en" ? "In cart" : "En carrito"}:</span>
            <span><strong>${qty}</strong></span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    }

    const { t: tot, count } = total();
    totalValueEl.textContent = money(tot);
    totalItemsEl.textContent = t("items")(count);

    grid.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        vibe(12);
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        const cur = cartQty(id);
        if(action === "add") setQty(id, cur + 1);
        else setQty(id, cur - 1);
        render();
      }, {passive:true});
    });
  }

  langBtn.addEventListener("click", () => {
    vibe(10);
    state.lang = state.lang === "en" ? "es" : "en";
    localStorage.setItem("cw_lang", state.lang);
    render();
  }, {passive:true});

  textOrderBtn.addEventListener("click", () => {
    vibe(16);
    const { count } = total();
    if(!count){ showModal("Heads up", escapeHtml(t("emptyCart"))); return; }
    openSMS(buildMessage());
  }, {passive:true});

  copyBtn.addEventListener("click", async () => {
    vibe(16);
    const { count } = total();
    if(!count){ showModal("Heads up", escapeHtml(t("emptyCart"))); return; }

    const msg = buildMessage();
    let ok = false;
    try{
      await navigator.clipboard.writeText(msg);
      ok = true;
    }catch(e){
      try{
        const ta = document.createElement("textarea");
        ta.value = msg;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand("copy");
        ta.remove();
      }catch(e2){}
    }

    if(ok){
      showModal(t("copied"),
        `${t("copiedHint")}<br><br>
         <div style="white-space:pre-wrap;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);padding:10px;border-radius:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;line-height:1.25;">
         ${escapeHtml(msg)}
         </div>`
      );
    }else{
      showModal("Copy failed", "Your browser blocked clipboard access. Long-press and select the message inside the box to copy.");
    }
  });

  modalClose.addEventListener("click", () => { vibe(8); hideModal(); }, {passive:true});
  modalOverlay.addEventListener("click", (e) => {
    if(e.target === modalOverlay){ vibe(8); hideModal(); }
  });

  render();
})();
</script>
</body>
</html>
